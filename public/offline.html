<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b0a" />
    <title>Offline · Spotify clone</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b0a;
        color: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 20%, rgba(74, 222, 128, 0.12), transparent 36%),
          #090b0a;
      }
      main {
        width: min(460px, 100%);
        padding: 36px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        background: rgba(17, 20, 18, 0.92);
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(74, 222, 128, 0.35);
        border-radius: 50%;
        background: rgba(74, 222, 128, 0.1);
        color: #4ade80;
        font-size: 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 25px;
      }
      p {
        margin: 0;
        color: #a3a3a3;
        font-size: 14px;
        line-height: 1.65;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 11px 22px;
        background: #4ade80;
        color: #041107;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        background: #404040;
        color: #a3a3a3;
      }
      #status {
        min-height: 20px;
        margin-top: 14px;
        color: #737373;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">↯</div>
      <h1>You’re offline</h1>
      <p>
        The connection changed while this page was loading. The site is safe—reconnect to continue
        browsing and streaming music.
      </p>
      <button id="retry" type="button">Try again</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
      const retryButton = document.getElementById("retry")
      const status = document.getElementById("status")

      const retry = async () => {
        retryButton.disabled = true
        status.textContent = "Checking connection…"

        try {
          const response = await fetch(`/online.txt?time=${Date.now()}`, { cache: "no-store" })
          if (!response.ok) throw new Error("Connection check failed")
          window.location.reload()
        } catch {
          status.textContent = "Still offline. Your page will retry when the connection returns."
          retryButton.disabled = false
        }
      }

      retryButton.addEventListener("click", retry)
      window.addEventListener("online", retry)
    </script>
  </body>
</html>
