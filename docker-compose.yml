services:
  web:
    build:
      context: .
      # NEXT_PUBLIC_* are inlined at `next build`, Stripe / Supabase / Redis clients are created at import time -
      # the build needs every value the running site needs (same shape as outreach-tool's Dockerfile)
      args:
        - NEXT_PUBLIC_PRODUCTION_URL=${NEXT_PUBLIC_PRODUCTION_URL}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
        - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
        - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
        - PUSHER_APP_ID=${PUSHER_APP_ID}
        - NEXT_PUBLIC_PUSHER_APP_KEY=${NEXT_PUBLIC_PUSHER_APP_KEY}
        - PUSHER_SECRET=${PUSHER_SECRET}
        - STRIPE_SECRET_KEY_TEST=${STRIPE_SECRET_KEY_TEST}
        - STRIPE_SECRET_KEY_LIVE=${STRIPE_SECRET_KEY_LIVE}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST}
        - STRIPE_WEBHOOK_SECRET_TEST=${STRIPE_WEBHOOK_SECRET_TEST}
        - STRIPE_WEBHOOK_SECRET_LIVE=${STRIPE_WEBHOOK_SECRET_LIVE}
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - OWNER_IDS_ARR=${OWNER_IDS_ARR}
        - DEVICE_ID_ENCRYPTION_KEY=${DEVICE_ID_ENCRYPTION_KEY}
    container_name: music-jokik
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      # 3010 on the host - outreach-tool's own compose already takes 3000; drop this block behind Coolify / Traefik
      - "3010:3000"
    environment:
      - NODE_ENV=production

      - NEXT_PUBLIC_PRODUCTION_URL=${NEXT_PUBLIC_PRODUCTION_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}

      # self-hosted Supabase (supabase.music.jokik.fi) - dev_readme-self-hosted-supabase.md
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

      # device-id rate limits
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}

      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - NEXT_PUBLIC_PUSHER_APP_KEY=${NEXT_PUBLIC_PUSHER_APP_KEY}
      - PUSHER_SECRET=${PUSHER_SECRET}

      # playlist purchases
      - STRIPE_SECRET_KEY_TEST=${STRIPE_SECRET_KEY_TEST}
      - STRIPE_SECRET_KEY_LIVE=${STRIPE_SECRET_KEY_LIVE}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST}
      - STRIPE_WEBHOOK_SECRET_TEST=${STRIPE_WEBHOOK_SECRET_TEST}
      - STRIPE_WEBHOOK_SECRET_LIVE=${STRIPE_WEBHOOK_SECRET_LIVE}

      # Cloudflare robot protection (the widget keeps working with the site on the VPS)
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}

      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OWNER_IDS_ARR=${OWNER_IDS_ARR}
      - DEVICE_ID_ENCRYPTION_KEY=${DEVICE_ID_ENCRYPTION_KEY}
